<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal &middot; Pikzy</title>
<meta name="description" content="Pikzy Legal">
<style>
  :root {
    --bg: #ffffff;
    --panel: #f5f7f7;
    --text: #12201f;
    --muted: #5c6b6a;
    --accent: #0f7a5a;
    --rule: #dde4e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #070f11;
      --panel: #0e1a1c;
      --text: #eef4f3;
      --muted: #9aacab;
      --accent: #46e0a0;
      --rule: #1d2d2f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-block: 32px;
    padding-inline: 20px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 46rem; margin: 0 auto; }
  nav { margin-bottom: 36px; padding-bottom: 20px; border-bottom: 1px solid var(--rule); }
  nav a {
    margin-right: 18px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-decoration: none;
  }
  nav a:hover, nav a[aria-current="page"] { color: var(--accent); }
  h1 { margin: 0 0 8px; font-size: 1.85rem; line-height: 1.25; letter-spacing: -0.01em; }
  h2 { margin: 40px 0 12px; font-size: 1.2rem; letter-spacing: -0.005em; }
  h3 { margin: 28px 0 8px; font-size: 1rem; }
  p { margin: 0 0 16px; }
  ul { margin: 0 0 16px; padding-left: 22px; }
  li { margin-bottom: 8px; }
  li > ul { margin-top: 8px; }
  hr { margin: 36px 0; border: 0; border-top: 1px solid var(--rule); }
  a { color: var(--accent); }
  code {
    padding: 2px 5px;
    background: var(--panel);
    border-radius: 4px;
    font-size: 0.9em;
  }
  strong { font-weight: 650; }
  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>
<main>
<nav><a href="./" aria-current="page">Pikzy</a><a href="./privacy/">Privacy Policy</a><a href="./terms/">Terms of Service</a></nav>
<h1>Pikzy</h1>
<p>Pikzy is a sports social app: post a photo Pik, check in at the game, draft a
lineup against a friend.</p>
<h2>Legal</h2>
<ul>
<li><a href="./privacy/">Privacy Policy</a></li>
<li><a href="./terms/">Terms of Service</a></li>
</ul>
<h2>Contact</h2>
<p>Questions, or to report something:
<a href="mailto:pikzyapp@gmail.com">pikzyapp@gmail.com</a></p>
<footer>Pikzy &middot; <a href="mailto:pikzyapp@gmail.com">pikzyapp@gmail.com</a></footer>
</main>
</body>
</html>
